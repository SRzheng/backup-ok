<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找不到頁面 · 備份都ok</title>
<link rel="icon" type="image/png" sizes="64x64" href="/backup-ok/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/backup-ok/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/backup-ok/icons/apple-touch-icon.png">
<style>
@font-face {
  font-family: "BKSerif";
  src: url(/backup-ok/fonts/serif-light-v2.woff2) format("woff2");
  font-weight: 300; font-style: normal; font-display: swap;
}
:root {
  --paper: #F4F4F1;
  --ink: #1D1D1B;
  --ink-2: #5A5A52;
  --mute: #9C9C95;
  --line: rgba(29,29,27,.10);
  --line-strong: rgba(29,29,27,.24);
  --ai: #44617B;
  --font: "BKSerif", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
  --col: 620px;
  --top-h: 52px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-weight: 300; font-size: 16.5px; line-height: 1.95; letter-spacing: .02em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1, h2, h3, b, strong { font-weight: 300; }
a { color: inherit; }
::selection { background: rgba(68,97,123,.18); }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 2px; }

.top {
  position: sticky; top: 0; z-index: 20; height: var(--top-h);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 clamp(18px, 3vw, 40px);
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(244,244,241,.74);
  -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  border-bottom: 1px solid var(--line);
  font-size: 14px; letter-spacing: .05em;
}
.top nav { display: flex; gap: 22px; }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
.brand img { width: 20px; height: 20px; display: block; }
.top nav a { text-decoration: none; color: var(--ink-2); transition: color .3s; }
.top nav a:hover { color: var(--ink); }

.wrap { max-width: calc(var(--col) + 96px); margin: 0 auto; padding: 0 clamp(22px, 4vw, 48px); }

.hero { padding: clamp(84px, 16vh, 176px) 0 clamp(56px, 9vh, 96px); }
.hero .for { font-size: 14px; color: var(--ink-2); letter-spacing: .14em; margin: 0 0 28px; }
.hero h1 { font-size: clamp(64px, 12vw, 128px); line-height: 1.02; letter-spacing: -.015em; margin: 0 0 30px; }
.hero .sub { font-size: clamp(18px, 2.2vw, 22px); color: var(--ink-2); letter-spacing: .06em; line-height: 1.8; margin: 0 0 48px; }
.ch { display: inline-block; }

.dl { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--line); }
.btn {
  font-family: var(--font); font-weight: 300; font-size: 16px; letter-spacing: .14em;
  color: var(--ink); background: transparent; text-decoration: none; display: inline-block;
  border: 1px solid var(--ink); border-radius: 999px; padding: 10px 30px; cursor: pointer;
  transition: transform .4s var(--ease-spring), background .3s, color .3s, border-color .3s;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:active { transform: scale(.96); }
.btn[aria-disabled="true"] { border-color: var(--line-strong); color: var(--mute); pointer-events: none; }
.dl .meta { font-size: 13.5px; color: var(--mute); letter-spacing: .05em; }

section { padding: 72px 0 80px; border-top: 1px solid var(--line); }
.no { font-size: 13px; color: var(--mute); letter-spacing: .14em; margin: 0 0 14px; }
h2 { font-size: clamp(28px, 4vw, 38px); line-height: 1.3; letter-spacing: -.005em; margin: 0 0 16px; }
.lede { font-size: 18px; color: var(--ink-2); line-height: 1.9; margin: 0 0 36px; }
p { margin: 0 0 14px; }
.muted { color: var(--ink-2); }

/* 領取表單:髮絲線底線輸入框 */
.claim { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.field { flex: 1 1 260px; min-width: 0; }
.field label { display: block; font-size: 13px; color: var(--mute); letter-spacing: .12em; margin-bottom: 4px; }
.field input {
  width: 100%; border: 0; border-bottom: 1px solid var(--line-strong); background: transparent;
  font-family: var(--font); font-weight: 300; font-size: 19px; letter-spacing: .03em; color: var(--ink);
  padding: 8px 0 10px; border-radius: 0; outline: none; transition: border-color .3s;
}
.field input:focus { border-bottom-color: var(--ink); }
.field input::placeholder { color: var(--mute); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.msg { min-height: 26px; margin-top: 14px; font-size: 14.5px; color: var(--ink-2); letter-spacing: .03em; }
.msg.err { color: #8A3B2E; }

.result { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .7s var(--ease-out); }
.result.on { grid-template-rows: 1fr; }
.result > div { overflow: hidden; }
.result .inner { padding-top: 26px; opacity: 0; filter: blur(6px); transform: translateY(6px);
  transition: opacity .7s .1s var(--ease-out), filter .7s .1s var(--ease-out), transform .7s .1s var(--ease-out); }
.result.on .inner { opacity: 1; filter: blur(0); transform: none; }
.keyrow { display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); padding: 16px 0; }
.keyrow code { flex: 1 1 auto; font-family: ui-monospace, Menlo, monospace; font-size: clamp(16px, 2.4vw, 21px); letter-spacing: .06em; color: var(--ink); word-break: break-all; }
.ghost {
  font-family: var(--font); font-weight: 300; font-size: 14px; letter-spacing: .1em; color: var(--ink);
  background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 18px; min-width: 92px; cursor: pointer;
  transition: transform .35s var(--ease-spring), border-color .3s;
}
.ghost:hover { border-color: var(--ink); }
.ghost:active { transform: scale(.96); }
.swap-t { display: inline-block; transition: opacity .28s, filter .28s, transform .28s; }
.swap-t.out { opacity: 0; filter: blur(6px); transform: translateY(5px); }
.next { list-style: none; margin: 22px 0 0; padding: 0; counter-reset: s; }
.next li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 15.5px; }
.next li::before { content: counter(s); color: var(--ink); font-size: 18px; line-height: 1.6; }
.note { border-left: 1px solid var(--ai); padding: 2px 0 2px 20px; margin: 28px 0 0; color: var(--ink-2); font-size: 15px; }

.rows { border-top: 1px solid var(--line); }
.rows .r { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.rows .h { font-size: 17px; letter-spacing: .03em; }
.rows .d { color: var(--ink-2); font-size: 15.5px; }

footer { border-top: 1px solid var(--line); padding: 26px 0 56px; font-size: 13px; color: var(--mute); letter-spacing: .05em; display: flex; gap: 22px; flex-wrap: wrap; }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }

.js .hero .ch { opacity: 0; filter: blur(10px); transform: translateY(.14em); }
.js .hero .ch.in { opacity: 1; filter: blur(0); transform: none; transition: opacity .8s var(--ease-out), filter .8s var(--ease-out), transform .8s var(--ease-out); }
.js .reveal { opacity: 0; filter: blur(6px); transform: translateY(8px); }
.js .reveal.in { opacity: 1; filter: blur(0); transform: none; transition: opacity .9s var(--ease-out), filter .9s var(--ease-out), transform .9s var(--ease-out); }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .rows .r { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .top nav { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
  .js .hero .ch, .js .reveal, .result .inner { opacity: 1 !important; filter: none !important; transform: none !important; }
}
</style>
<style>
.doc { padding: clamp(72px, 12vh, 132px) 0 40px; }
.doc h1 { font-size: clamp(40px, 6vw, 60px); line-height: 1.15; letter-spacing: -.01em; margin: 0 0 18px; }
.doc .date { font-size: 13.5px; color: var(--mute); letter-spacing: .06em; margin: 0 0 40px; }
.doc h3 { font-size: 18px; letter-spacing: .04em; margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line-strong); }
.doc ul { margin: 0 0 14px; padding-left: 1.2em; color: var(--ink-2); }
.doc li { margin-bottom: 6px; }
.todo { border-bottom: 1px dashed var(--ai); color: var(--ai); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/backup-ok/"><img src="/backup-ok/icons/favicon-64.png" alt="" width="20" height="20">備份都ok</a>
  <nav><a href="/backup-ok/manual/">使用說明</a><a href="/backup-ok/privacy/">隱私權政策</a></nav>
</header>
<main class="wrap">
  <article class="doc">
    <p class="no">404</p>
    <h1>這裡沒有東西</h1>
    <p class="lede">你要找的頁面不存在，可能已經搬走了。</p>
    <a class="btn" href="/backup-ok/">回到首頁</a>
  </article>

  <footer>
    <a href="/backup-ok/">下載</a>
    <a href="/backup-ok/manual/">使用說明</a>
    <a href="/backup-ok/privacy/">隱私權政策</a>
    <span>© 2026 備份都ok</span>
  </footer>
</main>
</body>
</html>
